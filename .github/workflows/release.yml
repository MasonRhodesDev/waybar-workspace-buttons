    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    uses: MasonRhodesDev/packaging-workflows/.github/workflows/release.yml@3d0c5630674f086918226d0140c51b97887c799f # v1
    secrets: inherit
    with:
      spec-name: waybar-workspace-buttons
      copr-chroots: >-
        fedora-43-x86_64 fedora-44-x86_64 fedora-45-x86_64 fedora-rawhide-x86_64
        fedora-43-aarch64 fedora-44-aarch64 fedora-45-aarch64 fedora-rawhide-aarch64
