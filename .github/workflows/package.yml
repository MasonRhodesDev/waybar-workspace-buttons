name: Package

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch:
    uses: MasonRhodesDev/packaging-workflows/.github/workflows/arch-package.yml@v1
  rpm:
    uses: MasonRhodesDev/packaging-workflows/.github/workflows/rpm-check.yml@v1
    with:
      spec-name: waybar-workspace-buttons
      # hyprland-workspace-zones BuildRequires pkgconfig(hyprland)
      extra-copr-repos: nett00n/hyprland
